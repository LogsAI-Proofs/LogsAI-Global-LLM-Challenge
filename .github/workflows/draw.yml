name: Event-day draw

on:
  workflow_dispatch:
    inputs:
      draw_date:
        description: 'Draw date (YYYY-MM-DD)'
        required: true
      channel:
        description: 'Channel'
        required: true
        default: 'all'
        type: choice
        options: [all, cn, us]
  # 赛事日启用：按 UTC 时间配置，确保两地收盘后执行。
  # schedule:
  #   - cron: '30 22 * * *'

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Draw
        run: python draw_event_day.py --channel "${{ inputs.channel }}" --draw-date "${{ inputs.draw_date }}"
      - name: Commit manifests
        run: |
          git config user.name "LogsAI-Draw-Bot"
          git config user.email "bot@logs-ai.com"
          git add draw_manifest_cn.json draw_manifest_us.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no manifest changes"
          else
            git commit -m "赛事日抽签 manifest: ${{ inputs.draw_date }} (${{ inputs.channel }})"
            git push
          fi
